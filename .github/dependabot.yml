version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /directory_server
      - /jmcore
      - /jmwallet
      - /jmwalletd
      - /maker
      - /orderbook_watcher
      - /taker
      - /tumbler
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /directory_server
      - /jmwalletd
      - /maker
      - /orderbook_watcher
      - /taker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-base-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tests/playwright
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns: ["*"]
